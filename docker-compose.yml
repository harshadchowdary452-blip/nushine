version: "3.8"

# Production-compose baseline. The API container refuses to start without
# SECRET_KEY / SUPER_ADMIN_PASSWORD (see app/config.py production validation).
# The React SPA is intentionally not built here — deploy the frontend separately
# (e.g. nginx/CDN) and point CORS_ORIGINS at its public origin.

services:
  db:
    image: postgres:16-alpine
    container_name: dental-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dental_hospital
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dental-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: dental-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/dental_hospital
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/dental_hospital
      REDIS_URL: redis://redis:6379/0
      # Required at `docker compose up` time — no weak fallbacks (the app refuses
      # to boot with placeholder secrets in production).
      #   SECRET_KEY:  python -c "import secrets;print(secrets.token_urlsafe(48))"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in the environment}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD must be set in the environment}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-superadmin@dental.com}
      ENVIRONMENT: production
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app/uploads:/app/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
